services:
  api:
    image: ghcr.io/shashwotghimire/nepali-reels/api:latest
    build:
      context: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
  worker:
    image: ghcr.io/shashwotghimire/nepali-reels/worker:latest
    build:
      context: ./api
    command: node dist/worker.js
    env_file:
      - ./api/.env
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
  web:
    image: ghcr.io/shashwotghimire/nepali-reels/web:latest
    build:
      context: ./web
    ports:
      - "5173:80"
    restart: unless-stopped
  redis:
    image: redis:8.8-alpine
    container_name: redis-reels
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
networks:
  internal:
    driver: bridge
volumes:
  redis_data:
